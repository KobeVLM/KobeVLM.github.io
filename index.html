<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SAM — Module 9 & 10 Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --border-hover: #3a3a3a;
    --text: #e8e8e8;
    --text-muted: #6b6b6b;
    --text-dim: #3d3d3d;
    --accent: #e8e8e8;
    --green: #3d7a5c;
    --green-bg: #0e2019;
    --green-text: #6dbb96;
    --red: #7a3d3d;
    --red-bg: #200e0e;
    --red-text: #bb6d6d;
    --amber: #7a6b3d;
    --amber-bg: #1e1a0e;
    --amber-text: #c4a85a;
    --blue: #3d5c7a;
    --blue-bg: #0e1820;
    --blue-text: #6d9abb;
    --radius: 6px;
    --radius-lg: 10px;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    font-size:15px;
  }

  /* layout */
  .shell{max-width:720px;margin:0 auto;padding:48px 24px 80px;}

  /* header */
  .site-header{margin-bottom:48px;animation:fadeUp .5s ease both;}
  .site-header .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    color:var(--text-muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .site-header h1{font-size:22px;font-weight:500;color:var(--text);margin-bottom:6px;}
  .site-header p{font-size:13px;color:var(--text-muted);}

  /* nav tabs */
  .nav{
    display:flex;gap:4px;
    border-bottom:1px solid var(--border);
    margin-bottom:32px;
    animation:fadeUp .5s .05s ease both;
  }
  .nav-btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:400;
    color:var(--text-muted);
    background:none;
    border:none;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:1px solid transparent;
    margin-bottom:-1px;
    transition:color .15s, border-color .15s;
  }
  .nav-btn:hover{color:var(--text);}
  .nav-btn.active{color:var(--text);border-bottom-color:var(--text);}

  /* filter chips */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;}
  .chip{
    font-size:12px;
    font-family:var(--mono);
    padding:4px 12px;
    border-radius:99px;
    border:1px solid var(--border);
    background:none;
    color:var(--text-muted);
    cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--border-hover);color:var(--text);}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  /* progress */
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
  .progress-track{height:1px;background:var(--border);border-radius:99px;margin-bottom:28px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--text);border-radius:99px;transition:width .4s ease;}

  /* question card */
  .q-wrap{animation:fadeUp .25s ease both;}
  .q-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .q-num{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .badge{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.06em;
    padding:2px 8px;
    border-radius:99px;
    text-transform:uppercase;
  }
  .badge-mcq{background:var(--blue-bg);color:var(--blue-text);}
  .badge-tf{background:var(--green-bg);color:var(--green-text);}
  .badge-essay{background:var(--amber-bg);color:var(--amber-text);}
  .badge-m9{background:var(--green-bg);color:var(--green-text);}
  .badge-m10{background:var(--blue-bg);color:var(--blue-text);}

  .q-text{font-size:16px;font-weight:400;color:var(--text);margin-bottom:20px;line-height:1.65;}

  /* options */
  .opts{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .12s, background .12s;
    font-size:14px;
    color:var(--text-muted);
    user-select:none;
  }
  .opt:hover:not(.locked){border-color:var(--border-hover);color:var(--text);}
  .opt.selected:not(.locked){border-color:var(--text-muted);color:var(--text);}
  .opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
  .opt.show-correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);opacity:.7;}
  .opt-letter{
    font-family:var(--mono);font-size:11px;
    min-width:18px;margin-top:2px;
    color:inherit;opacity:.6;
  }
  .opt-text{flex:1;line-height:1.5;}

  /* tf */
  .tf-opts{display:flex;gap:8px;margin-bottom:20px;}
  .tf-opt{
    flex:1;padding:12px;text-align:center;
    border:1px solid var(--border);border-radius:var(--radius);
    cursor:pointer;font-size:14px;color:var(--text-muted);
    transition:all .12s;user-select:none;
  }
  .tf-opt:hover:not(.locked){border-color:var(--border-hover);color:var(--text);}
  .tf-opt.selected:not(.locked){border-color:var(--text-muted);color:var(--text);}
  .tf-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
  .tf-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
  .tf-opt.show-correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);opacity:.7;}

  /* essay */
  .essay-note{
    font-size:12px;color:var(--text-muted);
    font-family:var(--mono);margin-bottom:14px;
  }
  .hint-toggle{
    background:none;border:none;cursor:pointer;
    font-size:12px;color:var(--text-muted);
    font-family:var(--mono);padding:0;
    margin-bottom:10px;
    transition:color .12s;
    display:block;
  }
  .hint-toggle:hover{color:var(--amber-text);}
  .hint-box{
    padding:14px 16px;border-left:2px solid var(--amber);
    background:var(--amber-bg);border-radius:0 var(--radius) var(--radius) 0;
    font-size:13px;color:var(--amber-text);
    line-height:1.65;margin-bottom:16px;
    animation:fadeUp .2s ease;
  }
  .hint-box strong{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:6px;}

  /* calc reveal */
  .calc-toggle{
    background:none;border:none;cursor:pointer;
    font-size:11px;color:var(--text-dim);
    font-family:var(--mono);padding:0;
    margin-bottom:8px;transition:color .12s;display:block;
  }
  .calc-toggle:hover{color:var(--text-muted);}
  .calc-box{
    font-family:var(--mono);font-size:13px;
    padding:12px 14px;border-radius:var(--radius);
    background:var(--surface2);color:var(--text-muted);
    margin-bottom:14px;animation:fadeUp .2s ease;
  }

  /* essay mark buttons */
  .essay-btns{display:flex;gap:8px;}

  /* action buttons */
  .btn{
    font-family:var(--sans);font-size:13px;font-weight:400;
    padding:9px 18px;border-radius:var(--radius);
    border:1px solid var(--border);
    background:none;color:var(--text-muted);
    cursor:pointer;transition:all .12s;
  }
  .btn:hover{border-color:var(--border-hover);color:var(--text);}
  .btn:disabled{opacity:.3;cursor:not-allowed;}
  .btn-primary{
    background:var(--text);color:var(--bg);
    border-color:var(--text);
  }
  .btn-primary:hover{opacity:.85;color:var(--bg);}
  .btn-green{background:var(--green-bg);color:var(--green-text);border-color:var(--green);}
  .btn-green:hover{opacity:.8;}
  .btn-red{background:var(--red-bg);color:var(--red-text);border-color:var(--red);}
  .btn-red:hover{opacity:.8;}

  /* row */
  .btn-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .btn-row .stats{font-family:var(--mono);font-size:11px;color:var(--text-dim);}

  /* score screen */
  .score-screen{text-align:center;padding:48px 0;animation:fadeUp .3s ease;}
  .score-big{font-size:72px;font-weight:300;color:var(--text);line-height:1;}
  .score-label{font-family:var(--mono);font-size:12px;color:var(--text-muted);margin:8px 0 32px;}
  .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto 32px;}
  .score-stat{padding:16px;border:1px solid var(--border);border-radius:var(--radius-lg);}
  .score-stat-n{font-size:28px;font-weight:300;}
  .score-stat-l{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em;}
  .s-green{color:var(--green-text);}
  .s-red{color:var(--red-text);}

  /* flashcards */
  .fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
  .fc{
    border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;min-height:110px;cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative;
    animation:fadeUp .3s ease;
  }
  .fc:hover{border-color:var(--border-hover);background:var(--surface);}
  .fc.flipped{background:var(--surface);}
  .fc-mod{
    position:absolute;top:10px;right:10px;
    font-family:var(--mono);font-size:9px;
    letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:99px;
  }
  .fc-term{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;padding-right:28px;}
  .fc.flipped .fc-term{font-size:11px;font-family:var(--mono);color:var(--text-dim);font-weight:300;margin-bottom:8px;}
  .fc-def{font-size:12px;color:var(--text-muted);line-height:1.55;display:none;}
  .fc.flipped .fc-def{display:block;}
  .fc-hint{position:absolute;bottom:10px;right:10px;font-size:9px;font-family:var(--mono);color:var(--text-dim);}
  .fc.flipped .fc-hint{display:none;}

  /* cheat sheet */
  .cs-block{margin-bottom:36px;animation:fadeUp .3s ease;}
  .cs-h{
    font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-muted);padding-bottom:10px;
    border-bottom:1px solid var(--border);margin-bottom:14px;
  }
  table.cs-t{width:100%;border-collapse:collapse;font-size:13px;}
  table.cs-t th{
    text-align:left;padding:6px 10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-dim);
    border-bottom:1px solid var(--border);font-weight:400;
  }
  table.cs-t td{
    padding:9px 10px;border-bottom:1px solid var(--border);
    color:var(--text-muted);vertical-align:top;line-height:1.5;
  }
  table.cs-t tr:last-child td{border-bottom:none;}
  table.cs-t td:first-child{color:var(--text);font-weight:500;}
  .pill{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:99px;margin:1px;}
  .p-g{background:var(--green-bg);color:var(--green-text);}
  .p-r{background:var(--red-bg);color:var(--red-text);}
  .p-a{background:var(--amber-bg);color:var(--amber-text);}
  .p-b{background:var(--blue-bg);color:var(--blue-text);}
  .formula{
    font-family:var(--mono);font-size:13px;
    padding:12px 16px;background:var(--surface2);
    border-radius:var(--radius);color:var(--text);
    margin:8px 0;
  }
  .note{
    font-size:13px;padding:12px 16px;
    border-left:2px solid var(--blue);
    background:var(--blue-bg);border-radius:0 var(--radius) var(--radius) 0;
    color:var(--blue-text);margin:8px 0;line-height:1.6;
  }
  .cs-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .rto-box{padding:14px 16px;border-radius:var(--radius-lg);border:1px solid var(--border);}

  /* animations */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .tab-content{animation:fadeUp .2s ease;}

  /* scrollbar */
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

  /* responsive */
  @media(max-width:520px){
    .shell{padding:32px 16px 60px;}
    .fc-grid{grid-template-columns:1fr 1fr;}
    .score-big{font-size:52px;}
    .cs-two{grid-template-columns:1fr;}
    table.cs-t th:nth-child(3),table.cs-t td:nth-child(3){display:none;}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="site-header">
    <div class="eyebrow">Systems Administration & Management</div>
    <h1>Module 9 &amp; 10 — Reviewer</h1>
    <p>Storage, RAID, High Availability &amp; Fault Tolerance &nbsp;·&nbsp; Pre-final coverage</p>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-tab="quiz">Quiz</button>
    <button class="nav-btn" data-tab="flash">Flashcards</button>
    <button class="nav-btn" data-tab="cheat">Cheat Sheet</button>
  </nav>

  <div id="tab-quiz" class="tab-content"></div>
  <div id="tab-flash" class="tab-content" style="display:none"></div>
  <div id="tab-cheat" class="tab-content" style="display:none"></div>

</div>

<script>
const Q = [
  // Module 9
  {id:1,m:9,t:'mcq',pts:1,q:'What does RAID stand for?',o:['Redundant Array of Individual Disks','Redundant Array of Independent Disks','Rapid Array of Integrated Drives','Resilient Array of Integrated Data'],a:1},
  {id:2,m:9,t:'mcq',pts:1,q:'Which RAID level provides NO fault tolerance but delivers the highest read/write speed?',o:['RAID 1','RAID 5','RAID 0','RAID 10'],a:2},
  {id:3,m:9,t:'mcq',pts:1,q:'What is the minimum number of drives required for RAID 5?',o:['2','3','4','5'],a:1},
  {id:4,m:9,t:'mcq',pts:1,q:'Which RAID level uses mirroring only — an exact duplicate of all data?',o:['RAID 0','RAID 1','RAID 5','RAID 6'],a:1},
  {id:5,m:9,t:'mcq',pts:1,q:'A database server requires both high speed and fault tolerance. Which RAID is the best fit?',o:['RAID 0','RAID 1','RAID 5','RAID 10'],a:3},
  {id:6,m:9,t:'mcq',pts:1,q:'RAID 6 can tolerate how many simultaneous drive failures?',o:['None','1','2','3'],a:2},
  {id:7,m:9,t:'mcq',pts:1,q:'With 4 drives in RAID 1 (2-drive mirror), what percentage of total capacity is usable?',o:['100%','75%','67%','50%'],a:3},
  {id:8,m:9,t:'mcq',pts:1,q:'Which storage type operates over a high-speed network but appears as a local disk to servers?',o:['NAS','Cloud Storage','SAN','Local HDD'],a:2},
  {id:9,m:9,t:'mcq',pts:1,q:'A video production team needs pure speed. Raw footage can always be re-shot. Which RAID?',o:['RAID 10','RAID 6','RAID 0','RAID 5'],a:2},
  {id:10,m:9,t:'mcq',pts:1,q:'Which intelligent storage feature automatically moves cold (rarely accessed) data to cheaper storage?',o:['Snapshots','Thin Provisioning','Caching','Auto-Tiering'],a:3},
  {id:11,m:9,t:'mcq',pts:1,q:'What does the 3-2-1 backup rule specify?',o:['3 backups, 2 cloud copies, 1 local copy','3 copies of data, on 2 different media types, with 1 copy off-site','3 drives, 2 RAID arrays, 1 off-site tape','3 full backups per week, 2 incremental, 1 mirror'],a:1},
  {id:12,m:9,t:'mcq',pts:1,q:'Which intelligent storage feature allocates physical disk space only as data is actually written?',o:['Snapshots','Caching','Thin Provisioning','Auto-Tiering'],a:2},
  {id:13,m:9,t:'mcq',pts:1,q:'Which storage type is best described as "pay-per-use, accessible from anywhere, infinitely scalable"?',o:['Local Storage','SAN','NAS','Cloud Storage'],a:3},
  {id:14,m:9,t:'mcq',pts:1,q:'A snapshot in intelligent storage is best described as:',o:['A full backup copy of all data','A point-in-time, space-efficient copy of data','A mirror of data on another drive','A compressed archive file'],a:1},
  {id:15,m:9,t:'mcq',pts:1,q:'Which RAID level is typically recommended for backup servers due to its maximum fault tolerance?',o:['RAID 0','RAID 1','RAID 5','RAID 6'],a:3},
  {id:16,m:9,t:'tf',pts:1,q:'RAID 0 stripes data across multiple drives and provides fault tolerance if one drive fails.',a:false},
  {id:17,m:9,t:'tf',pts:1,q:'NAS (Network Attached Storage) allows multiple users to access shared folders over a local network.',a:true},
  {id:18,m:9,t:'tf',pts:1,q:'On-site storage is preferred for disaster recovery because it is immune to local disasters like fire or floods.',a:false},
  {id:19,m:9,t:'tf',pts:1,q:'RAID 10 requires a minimum of 4 drives and combines both mirroring and striping.',a:true},
  {id:20,m:9,t:'tf',pts:1,q:'Parity in RAID is a mathematical checksum that allows data recovery without needing a full mirror of every drive.',a:true},
  {id:21,m:9,t:'essay',pts:4,q:'A company stores medical records. Compare RAID 5 vs RAID 10 and justify which is more appropriate. Address fault tolerance, performance, and storage efficiency.',hint:'RAID 5: striping + parity, 1 drive failure tolerance, 67–94% usable capacity, good balance of speed and protection. RAID 10: mirror + stripe, 1 failure per mirror pair, 50% capacity, best combined performance + reliability. Medical records = critical data → argue RAID 10 for superior performance under load and stronger fault tolerance.'},
  {id:22,m:9,t:'essay',pts:3,q:'Explain the 3-2-1 backup rule and give a concrete real-world example of how an organization can implement it.',hint:'3 = three copies of data. 2 = on two different media types. 1 = one copy stored off-site. Example: 1 local HDD copy + 1 NAS device (different hardware) + 1 cloud copy via Azure Backup or AWS S3. Protects against hardware failure, site disaster, and accidental deletion.'},

  // Module 10
  {id:23,m:10,t:'mcq',pts:1,q:'What is the maximum downtime per year allowed under a 99.99% SLA?',o:['8.76 hours','52.6 minutes','5.26 minutes','3.65 days'],a:1},
  {id:24,m:10,t:'mcq',pts:1,q:'What is the primary difference between High Availability and Fault Tolerance?',o:['HA uses RAID; FT uses clustering','HA minimizes downtime with possible brief interruption; FT operates with zero downtime during failures','HA is software-based; FT is hardware-based','HA is cheaper; FT always uses geographic redundancy'],a:1},
  {id:25,m:10,t:'mcq',pts:1,q:'Which redundancy model fully duplicates all systems AND adds one extra spare — used in stock exchanges and air traffic control?',o:['N+1','N+M','2N','2N+1'],a:3},
  {id:26,m:10,t:'mcq',pts:1,q:'What does MTTR stand for?',o:['Mean Time To Recover','Maximum Time To Repair','Mean Time To Repair','Minimum Time To Restore'],a:2},
  {id:27,m:10,t:'mcq',pts:1,q:'A server has MTBF = 8,760 hrs and MTTR = 4 hrs. What is its availability?',o:['99.9%','99.95%','99.99%','98%'],a:1,calc:'8760 ÷ (8760 + 4) = 8760 ÷ 8764 = 0.99954… ≈ 99.95%'},
  {id:28,m:10,t:'mcq',pts:1,q:'Which load balancing algorithm routes each new request to the server with fewest active connections?',o:['Round Robin','Weighted Round Robin','IP Hash','Least Connections'],a:3},
  {id:29,m:10,t:'mcq',pts:1,q:'Which load balancing method ensures the same client always reaches the same server (session persistence)?',o:['Round Robin','Least Connections','IP Hash','Weighted Round Robin'],a:2},
  {id:30,m:10,t:'mcq',pts:1,q:'What does RPO define?',o:['The maximum time to restore service','The maximum acceptable data loss measured in time','The number of spare servers required','System uptime percentage'],a:1},
  {id:31,m:10,t:'mcq',pts:1,q:'Which failover type has the secondary system already fully running — providing near-instant switchover?',o:['Cold Standby','Warm Standby','Hot Standby','Manual Standby'],a:2},
  {id:32,m:10,t:'mcq',pts:1,q:'Which backup type copies ALL data every time — slowest backup, but simplest and fastest to restore?',o:['Incremental','Differential','Mirror','Full'],a:3},
  {id:33,m:10,t:'mcq',pts:1,q:'Which backup type copies ONLY data changed since the LAST backup (not last full)?',o:['Full','Differential','Incremental','Mirror'],a:2},
  {id:34,m:10,t:'mcq',pts:1,q:'An organization sets RPO = 1 hour. What does this practically mean?',o:['The system must be restored within 1 hour','They can afford to lose at most 1 hour of data','Backups must run exactly every 1 hour','Failover must complete in under 1 hour'],a:1},
  {id:35,m:10,t:'mcq',pts:1,q:'Which replication type writes data to the primary AND replica simultaneously — guaranteeing zero data loss?',o:['Asynchronous','Semi-Synchronous','Batch','Synchronous'],a:3},
  {id:36,m:10,t:'mcq',pts:1,q:'Which cluster type is used for scientific computing and AI training — and NOT for fault tolerance?',o:['Failover Cluster','Load Balancing Cluster','High-Performance Cluster (HPC)','Geographic Cluster'],a:2},
  {id:37,m:10,t:'mcq',pts:1,q:'N+1 redundancy for a system that needs 5 servers means deploying how many servers in total?',o:['5','6','7','10'],a:1},

const FC = [
  {m:9,term:'RAID 0',def:'Striping only. Min 2 drives. No fault tolerance. 100% usable capacity. Use case: video editing, scratch disks.'},
  {m:9,term:'RAID 1',def:'Mirroring only. Min 2 drives. Tolerates 1 drive failure. 50% capacity. Use case: OS drives, small critical systems.'},
  {m:9,term:'RAID 5',def:'Striping + distributed parity. Min 3 drives. Tolerates 1 failure. 67–94% capacity. Use case: file servers, general storage.'},
  {m:9,term:'RAID 6',def:'Striping + double parity. Min 4 drives. Tolerates 2 simultaneous failures. Use case: backup servers, large drives.'},
  {m:9,term:'RAID 10',def:'Mirror + Stripe. Min 4 drives. Tolerates 1 failure per mirror pair. 50% capacity. Use case: databases, VM hosts.'},
  {m:9,term:'NAS',def:'Network Attached Storage — shared file-level storage on the local network. Acts like an on-premises personal cloud for multiple users.'},
  {m:9,term:'SAN',def:'Storage Area Network — high-speed block-level storage network. Appears as a local disk to servers. Used for databases and VMs.'},
  {m:9,term:'Auto-Tiering',def:'ISS feature that automatically moves hot (frequently accessed) data to SSDs and cold (rarely accessed) data to cheaper HDDs or tape.'},
  {m:9,term:'Thin Provisioning',def:'Allocates storage on demand rather than upfront. A 1 TB volume is created but only uses physical space as data is written.'},
  {m:9,term:'Snapshot',def:'A point-in-time, space-efficient copy of data. Near-instant and used for fast backup/recovery without duplicating all data.'},
  {m:9,term:'3-2-1 Rule',def:'3 copies of data, on 2 different media types, with 1 copy off-site. E.g. local HDD + NAS + Azure cloud backup.'},
  {m:9,term:'Striping',def:'Splitting data across multiple drives so reads/writes happen in parallel. Increases performance. Used in RAID 0, 5, 6, 10.'},
  {m:9,term:'Parity',def:'A math checksum distributed across drives. Allows recovery of lost data without mirroring every bit. Used in RAID 5 and 6.'},
  {m:9,term:'Mirroring',def:'An exact duplicate of data written simultaneously to two (or more) drives. If one fails, the other takes over instantly.'},
  {m:10,term:'High Availability (HA)',def:'Minimizes downtime through quick recovery. May have a brief interruption. Measured in "nines" — 99.9%, 99.99%, etc.'},
  {m:10,term:'Fault Tolerance',def:'Zero downtime even during component failure. System continues without ANY interruption. More expensive than HA.'},
  {m:10,term:'MTBF',def:'Mean Time Between Failures — the average time a component operates before failing. Longer = more reliable.'},
  {m:10,term:'MTTR',def:'Mean Time To Repair — the average time it takes to fix a failure. Shorter = faster recovery.'},
  {m:10,term:'Availability Formula',def:'Availability = MTBF ÷ (MTBF + MTTR). Example: 8760 ÷ (8760 + 4) = 99.95%'},
  {m:10,term:'RTO',def:'Recovery Time Objective — the maximum acceptable time to restore service after a failure.'},
  {m:10,term:'RPO',def:'Recovery Point Objective — the maximum acceptable data loss measured in time. RPO = 1 hr means you can lose at most 1 hour of data.'},
  {m:10,term:'N+1 Redundancy',def:'For every N components needed, have 1 extra spare. Example: need 3 servers → deploy 4.'},
  {m:10,term:'2N Redundancy',def:'Fully duplicate every system — run two complete, independent systems simultaneously. Used in hospitals and data centers.'},
  {m:10,term:'2N+1 Redundancy',def:'Two full systems PLUS one extra spare. Used in mission-critical infrastructure: stock exchanges, air traffic control.'},
  {m:10,term:'Hot Standby',def:'Backup system already fully running. Instant failover. Most expensive. Used where zero downtime is required.'},
  {m:10,term:'Warm Standby',def:'Backup system partially running. Failover takes minutes. Balance between cost and recovery speed.'},
  {m:10,term:'Cold Standby',def:'Backup system powered off — needs full setup before use. Failover takes hours. Cheapest option.'},
  {m:10,term:'Synchronous Replication',def:'Data written to primary AND replica simultaneously. Zero data loss. Higher latency. Used for financial systems.'},
  {m:10,term:'Asynchronous Replication',def:'Data written to primary first, then replicated later. Some potential data loss (matches RPO window). Lower latency. Used for DR sites.'},
  {m:10,term:'Full Backup',def:'Copies all data every time. Slowest and uses most storage. Fastest and simplest to restore — only one backup set needed.'},
  {m:10,term:'Incremental Backup',def:'Copies only data changed since the last backup. Fastest backup, least storage. Slowest restore — needs full + ALL incrementals.'},
  {m:10,term:'Differential Backup',def:'Copies data changed since the last FULL backup. Medium speed and storage. Easier restore than incremental.'},
  {m:10,term:'Round Robin',def:'Load balancing: requests distributed in sequence (1→2→3→repeat). Best when all servers have equal capacity.'},
  {m:10,term:'IP Hash',def:'Load balancing: client IP determines which server handles the request. Guarantees session persistence — same client → same server.'},

let S = {
  tab:'quiz',
  modF:'all',
  qIdx:0,
  sel:null,
  revealed:false,
  score:0,
  correct:0,
  wrong:0,
  done:false,
  qs:[],
  flipped:{},
  showHint:{},
  showCalc:{},

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function filteredQs(){
  return S.modF==='all'?S.qs:S.qs.filter(q=>q.m===parseInt(S.modF));
}

function init(){
  S.qs=shuffle([...Q]);
  renderAll();
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      S.tab=b.dataset.tab;
      document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      ['quiz','flash','cheat'].forEach(t=>{
        document.getElementById('tab-'+t).style.display = t===S.tab?'':'none';
      });
      renderAll();
    });
  });
}

function renderAll(){
  if(S.tab==='quiz') renderQuiz();
  if(S.tab==='flash') renderFlash();
  if(S.tab==='cheat') renderCheat();
}

// ─── QUIZ ───────────────────────────────────────────────────────────────────
function renderQuiz(){
  const qs=filteredQs();
  const el=document.getElementById('tab-quiz');
  if(S.done){el.innerHTML=buildScore(qs);return;}
  if(!qs.length){el.innerHTML=`<p style="color:var(--text-muted);font-size:14px;">No questions for this filter.</p>`;return;}
  const idx=Math.min(S.qIdx,qs.length-1);
  const q=qs[idx];
  const pct=Math.round((idx/qs.length)*100);

  el.innerHTML=`
    <div class="chips">
      <button class="chip${S.modF==='all'?' active':''}" onclick="setMod('all')">All modules</button>
      <button class="chip${S.modF==='9'?' active':''}" onclick="setMod('9')">Module 9 — RAID</button>
      <button class="chip${S.modF==='10'?' active':''}" onclick="setMod('10')">Module 10 — HA &amp; FT</button>
    </div>
    <div class="progress-row">
      <span class="progress-label">${idx+1} / ${qs.length}</span>
      <span class="progress-label s-green">✓ ${S.correct}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-wrap">
      <div class="q-meta">
        <span class="badge badge-m${q.m}">Module ${q.m}</span>
        <span class="badge badge-${q.t}">${q.t==='mcq'?'MCQ':q.t==='tf'?'True / False':'Essay · '+q.pts+' pts'}</span>
      </div>
      <p class="q-text">${q.q}</p>
      ${buildInput(q)}
    </div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn" onclick="prevQ()" ${idx===0?'disabled':''}>← prev</button>
      <span class="stats">✓ ${S.correct} &nbsp;·&nbsp; ✗ ${S.wrong}</span>
      ${S.revealed?`<button class="btn btn-primary" onclick="nextQ()">next →</button>`:`<span></span>`}
    </div>
  `;
}

function buildInput(q){
  const L=['A','B','C','D'];
  if(q.t==='mcq'){
    const opts=q.o.map((o,i)=>{
      let cls='opt';
      if(S.revealed){
        cls+=' locked';
        if(i===q.a) cls+=' correct';
        else if(i===S.sel && i!==q.a) cls+=' wrong';
      } else {
        if(i===S.sel) cls+=' selected';
      }
      return `<div class="${cls}" onclick="selOpt(${i})"><span class="opt-letter">${L[i]}</span><span class="opt-text">${o}</span></div>`;
    }).join('');
    const calcHtml=q.calc&&S.revealed?`
      <button class="calc-toggle" onclick="toggleCalc(${q.id})">[ ${S.showCalc[q.id]?'hide':'show'} calculation ]</button>
      ${S.showCalc[q.id]?`<div class="calc-box">${q.calc}</div>`:''}
    `:'';
    return `<div class="opts">${opts}</div>${calcHtml}
      ${!S.revealed?`<button class="btn btn-primary" onclick="revealMCQ()">check answer</button>`:''}`;
  }
  if(q.t==='tf'){
    const tfC=['True','False'],tfV=[true,false];
    const opts=tfC.map((c,i)=>{
      let cls='tf-opt';
      if(S.revealed){
        cls+=' locked';
        if(tfV[i]===q.a) cls+=' correct';
        else if(S.sel===i&&tfV[i]!==q.a) cls+=' wrong';
      } else {
        if(S.sel===i) cls+=' selected';
      }
      return `<div class="${cls}" onclick="selTF(${i})">${c}</div>`;
    }).join('');
    return `<div class="tf-opts">${opts}</div>
      ${!S.revealed?`<button class="btn btn-primary" onclick="revealTF()">check answer</button>`:''}`;
  }
  if(q.t==='essay'){
    const sh=S.showHint[q.id];
    return `<p class="essay-note">${q.pts}-point question — self-grade after reading the guide</p>
      <button class="hint-toggle" onclick="toggleHint(${q.id})">${sh?'▲ hide answer guide':'▼ reveal answer guide'}</button>
      ${sh?`<div class="hint-box"><strong>Key points to include</strong>${q.hint}</div>`:''}
      ${!S.revealed?`<div class="essay-btns">
        <button class="btn btn-green" onclick="markEssay(true,${q.pts})">✓ I got it (${q.pts} pts)</button>
        <button class="btn btn-red" onclick="markEssay(false,0)">✗ need review</button>
      </div>`:'<span style="font-size:12px;font-family:var(--mono);color:var(--text-muted);">marked — continue when ready</span>'}`;
  }
  return '';
}

function buildScore(qs){
  const total=qs.reduce((a,q)=>a+q.pts,0);
  const pct=Math.round((S.score/total)*100);
  const msg=pct>=90?'excellent.':pct>=75?'good job.':pct>=60?'keep studying.':'needs work.';
  return `<div class="score-screen">
    <div class="score-big">${pct}<span style="font-size:32px;color:var(--text-muted)">%</span></div>
    <div class="score-label">${msg} &nbsp;·&nbsp; ${S.score} / ${total} pts</div>
    <div class="score-grid">
      <div class="score-stat"><div class="score-stat-n s-green">${S.correct}</div><div class="score-stat-l">correct</div></div>
      <div class="score-stat"><div class="score-stat-n s-red">${S.wrong}</div><div class="score-stat-l">wrong</div></div>
      <div class="score-stat"><div class="score-stat-n">${qs.length}</div><div class="score-stat-l">total</div></div>
    </div>
    <button class="btn btn-primary" onclick="resetQuiz()">try again (reshuffled)</button>
  </div>`;
}

window.setMod=f=>{S.modF=f;S.qIdx=0;S.sel=null;S.revealed=false;S.score=0;S.correct=0;S.wrong=0;S.done=false;S.qs=shuffle([...Q]);renderQuiz();};
window.setFc=f=>{S.fcF=f;S.flipped={};renderFlash();};
window.flipFC=i=>{S.flipped[i]=!S.flipped[i];renderFlash();};
window.toggleHint=id=>{S.showHint[id]=!S.showHint[id];renderQuiz();};
window.toggleCalc=id=>{S.showCalc[id]=!S.showCalc[id];renderQuiz();};

window.selOpt=i=>{if(!S.revealed){S.sel=i;renderQuiz();}};
window.selTF=i=>{if(!S.revealed){S.sel=i;renderQuiz();}};

window.revealMCQ=()=>{
  if(S.sel===null){return;}
  const q=filteredQs()[S.qIdx];
  S.revealed=true;
  if(S.sel===q.a){S.score+=q.pts;S.correct++;}else{S.wrong++;}
  renderQuiz();
};
window.revealTF=()=>{
  if(S.sel===null){return;}
  const q=filteredQs()[S.qIdx];
  S.revealed=true;
  const v=[true,false];
  if(v[S.sel]===q.a){S.score+=q.pts;S.correct++;}else{S.wrong++;}
  renderQuiz();
};
window.markEssay=(got,pts)=>{
  S.revealed=true;
  S.score+=pts;
  if(got)S.correct++;else S.wrong++;
  renderQuiz();
};
window.nextQ=()=>{
  const qs=filteredQs();
  if(S.qIdx>=qs.length-1){S.done=true;}else{S.qIdx++;}
  S.sel=null;S.revealed=false;
  renderQuiz();
};
window.prevQ=()=>{
  if(S.qIdx>0){S.qIdx--;S.sel=null;S.revealed=false;renderQuiz();}
};
window.resetQuiz=()=>{
  S.qIdx=0;S.sel=null;S.revealed=false;S.score=0;S.correct=0;S.wrong=0;S.done=false;
  S.flipped={};S.showHint={};S.showCalc={};S.qs=shuffle([...Q]);
  renderQuiz();
};

init();
</script>
</body>
</html>
