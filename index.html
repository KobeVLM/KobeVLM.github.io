<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FL033 – Japanese Language Midterm Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #C41E3A;
      --red-dark: #9B1B30;
      --gold: #D4A843;
      --cream: #FFF8F0;
      --bg: #FAF6F1;
      --card: #FFFFFF;
      --text: #2D2D2D;
      --text-light: #6B6B6B;
      --border: #E8E0D8;
      --correct: #2E8B57;
      --correct-bg: #E8F5E9;
      --incorrect: #C62828;
      --incorrect-bg: #FFEBEE;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-hover: 0 4px 20px rgba(0,0,0,0.12);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* === HEADER === */
    .hero {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: white;
      text-align: center;
      padding: 3rem 1.5rem 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '🌸';
      position: absolute;
      font-size: 8rem;
      opacity: 0.08;
      top: -1rem;
      right: -1rem;
    }
    .hero::after {
      content: '日本語';
      position: absolute;
      font-size: 6rem;
      opacity: 0.06;
      bottom: -1.5rem;
      left: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      position: relative;
    }
    .hero p {
      font-size: 1rem;
      opacity: 0.9;
      font-weight: 300;
      position: relative;
    }

    /* === SCOREBOARD === */
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      max-width: 700px;
      margin: -1.5rem auto 2rem;
      padding: 0 1rem;
      position: relative;
      z-index: 2;
    }
    .score-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.5rem;
      text-align: center;
      min-width: 130px;
      flex: 1;
    }
    .score-card .label { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }
    .score-card .value { font-size: 1.8rem; font-weight: 700; color: var(--red); }
    .score-card .value.perfect { color: var(--correct); }

    /* === NAV TABS === */
    .nav-wrap {
      max-width: 900px;
      margin: 0 auto 1.5rem;
      padding: 0 1rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      min-width: max-content;
    }
    .nav-tab {
      padding: 0.65rem 1.2rem;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-light);
      transition: all 0.25s;
      white-space: nowrap;
      font-family: inherit;
    }
    .nav-tab:hover { border-color: var(--red); color: var(--red); }
    .nav-tab.active {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }
    .nav-tab .tab-score {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      font-size: 0.7rem;
      margin-left: 0.4rem;
    }
    .nav-tab:not(.active) .tab-score {
      background: var(--cream);
      color: var(--text-light);
    }

    /* === QUIZ SECTION === */
    .quiz-section {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }
    .quiz-section.active { display: block; }

    .section-header {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid var(--red);
    }
    .section-header h2 { font-size: 1.3rem; color: var(--red-dark); margin-bottom: 0.2rem; }
    .section-header .meta { font-size: 0.85rem; color: var(--text-light); }

    /* === QUESTION CARD === */
    .q-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.25s;
      border: 2px solid transparent;
    }
    .q-card:hover { box-shadow: var(--shadow-hover); }
    .q-card.answered-correct { border-color: var(--correct); }
    .q-card.answered-incorrect { border-color: var(--incorrect); }

    .q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--red);
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 0.7rem;
      flex-shrink: 0;
    }
    .q-card.answered-correct .q-num { background: var(--correct); }
    .q-card.answered-incorrect .q-num { background: var(--incorrect); }

    .q-text {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
    }
    .q-text span { flex: 1; }

    /* MCQ Options */
    .options { display: flex; flex-direction: column; gap: 0.5rem; }
    .option {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    .option:hover { border-color: var(--gold); background: var(--cream); }
    .option.selected { border-color: var(--red); background: #FFF0F3; }
    .option.correct-answer { border-color: var(--correct); background: var(--correct-bg); }
    .option.wrong-answer { border-color: var(--incorrect); background: var(--incorrect-bg); }
    .option .radio {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 50%;
      margin-right: 0.75rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .option.selected .radio { border-color: var(--red); }
    .option.selected .radio::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }
    .option.correct-answer .radio { border-color: var(--correct); }
    .option.correct-answer .radio::after {
      content: '✓';
      font-size: 0.7rem;
      color: var(--correct);
      font-weight: 700;
    }
    .option.wrong-answer .radio { border-color: var(--incorrect); }
    .option.wrong-answer .radio::after {
      content: '✗';
      font-size: 0.7rem;
      color: var(--incorrect);
      font-weight: 700;
    }
    .option.disabled { pointer-events: none; }

    /* Text Input */
    .input-group { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .q-input {
      padding: 0.65rem 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      flex: 1;
      min-width: 150px;
      max-width: 300px;
    }
    .q-input:focus { border-color: var(--red); }
    .q-input.correct { border-color: var(--correct); background: var(--correct-bg); }
    .q-input.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
    .q-input:disabled { opacity: 0.8; }

    .feedback {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      font-weight: 500;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct { color: var(--correct); }
    .feedback.incorrect { color: var(--incorrect); }

    /* === BUTTONS === */
    .btn {
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-primary {
      background: var(--red);
      color: white;
    }
    .btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red);
    }
    .btn-outline:hover { background: var(--red); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .section-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    /* === RESULT BANNER === */
    .result-banner {
      display: none;
      text-align: center;
      padding: 1.5rem;
      border-radius: var(--radius);
      margin-top: 1rem;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .result-banner.show { display: block; }
    .result-banner.great { background: var(--correct-bg); color: var(--correct); }
    .result-banner.ok { background: #FFF8E1; color: #F57F17; }
    .result-banner.bad { background: var(--incorrect-bg); color: var(--incorrect); }

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-light);
      font-size: 0.8rem;
    }
    footer a { color: var(--red); text-decoration: none; }

    /* === RESPONSIVE === */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.6rem; }
      .scoreboard { gap: 0.75rem; }
      .score-card { min-width: 100px; padding: 0.75rem 1rem; }
      .score-card .value { font-size: 1.4rem; }
      .q-card { padding: 1.2rem; }
      .section-header { padding: 1.2rem; }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .q-card { animation: fadeIn 0.3s ease-out backwards; }
    .q-card:nth-child(2) { animation-delay: 0.03s; }
    .q-card:nth-child(3) { animation-delay: 0.06s; }
    .q-card:nth-child(4) { animation-delay: 0.09s; }
    .q-card:nth-child(5) { animation-delay: 0.12s; }

    /* Confetti canvas */
    #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  </style>
</head>

// ============================================================
// STATE
// ============================================================
let state = {};
quizData.forEach(sec => {
  state[sec.id] = { answers: {}, checked: false, score: 0 };
});
let activeTab = quizData[0].id;

// ============================================================
// RENDER
// ============================================================
function renderTabs() {
  const nav = document.getElementById('navTabs');
  nav.innerHTML = quizData.map(sec => {
    const s = state[sec.id];
    const scoreText = s.checked ? `${s.score}/${sec.questions.length}` : '';
    return `<button class="nav-tab ${sec.id === activeTab ? 'active' : ''}" onclick="switchTab('${sec.id}')">
      ${sec.title.split('—')[0].trim()}
      ${scoreText ? `<span class="tab-score">${scoreText}</span>` : ''}
    </button>`;
  }).join('');
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = quizData.map(sec => {
    const s = state[sec.id];
    let questionsHTML = '';

    sec.questions.forEach((q, i) => {
      const num = i + 1;
      const userAns = s.answers[i];
      let statusClass = '';
      if (s.checked) {
        if (sec.type === 'mcq') {
          statusClass = userAns === q.ans ? 'answered-correct' : 'answered-incorrect';
        } else {
          const isCorrect = q.ans.some(a => a.toLowerCase().trim() === (userAns || '').toLowerCase().trim());
          statusClass = isCorrect ? 'answered-correct' : 'answered-incorrect';
        }
      }

      questionsHTML += `<div class="q-card ${statusClass}" style="animation-delay:${Math.min(i * 0.03, 0.3)}s">`;
      questionsHTML += `<div class="q-text"><span class="q-num">${num}</span><span>${escHtml(q.q)}</span></div>`;

      if (sec.type === 'mcq') {
        questionsHTML += `<div class="options">`;
        q.opts.forEach((opt, j) => {
          let cls = '';
          if (s.checked) {
            cls += ' disabled';
            if (j === q.ans) cls += ' correct-answer';
            if (userAns === j && j !== q.ans) cls += ' wrong-answer';
          } else {
            if (userAns === j) cls += ' selected';
          }
          questionsHTML += `<div class="option${cls}" onclick="selectOption('${sec.id}',${i},${j})">
            <span class="radio"></span>${escHtml(opt)}
          </div>`;
        });
        questionsHTML += `</div>`;
      } else {
        const val = userAns || '';
        const inputCls = s.checked ? (q.ans.some(a => a.toLowerCase().trim() === val.toLowerCase().trim()) ? 'correct' : 'incorrect') : '';
        const disabled = s.checked ? 'disabled' : '';
        questionsHTML += `<div class="input-group">
          <input type="text" class="q-input ${inputCls}" ${disabled} value="${escAttr(val)}" placeholder="Type your answer..." oninput="inputAnswer('${sec.id}',${i},this.value)">
        </div>`;
        if (s.checked && !q.ans.some(a => a.toLowerCase().trim() === val.toLowerCase().trim())) {
          questionsHTML += `<div class="feedback incorrect show">Correct answer: ${escHtml(q.ans[0])}</div>`;
        }
      }

      questionsHTML += `</div>`;
    });

    const resultBanner = s.checked ? getResultBanner(s.score, sec.questions.length) : '';

    return `<section class="quiz-section ${sec.id === activeTab ? 'active' : ''}" data-section="${sec.id}">
      <div class="section-header">
        <h2>${escHtml(sec.title)}</h2>
        <div class="meta">${escHtml(sec.date)} &nbsp;•&nbsp; ${sec.questions.length} questions &nbsp;•&nbsp; ${sec.points} points</div>
      </div>
      ${questionsHTML}
      <div class="section-actions">
        ${!s.checked
          ? `<button class="btn btn-primary" onclick="checkSection('${sec.id}')">Check Answers</button>`
          : `<button class="btn btn-outline" onclick="resetSection('${sec.id}')">Try Again</button>`}
      </div>
      ${resultBanner}
    </section>`;
  }).join('');
}

function getResultBanner(score, total) {
  const pct = score / total;
  let cls, emoji, msg;
  if (pct === 1) { cls = 'great'; emoji = '🎉'; msg = 'Perfect score! すごい！'; }
  else if (pct >= 0.8) { cls = 'great'; emoji = '🌟'; msg = `Great job! ${score}/${total} correct!`; }
  else if (pct >= 0.6) { cls = 'ok'; emoji = '💪'; msg = `Good effort! ${score}/${total} — Keep studying!`; }
  else { cls = 'bad'; emoji = '📚'; msg = `${score}/${total} — Review and try again! がんばって！`; }
  return `<div class="result-banner show ${cls}">${emoji} ${msg}</div>`;
}

function updateScoreboard() {
  let totalCorrect = 0, totalQuestions = 0, totalAnswered = 0;
  quizData.forEach(sec => {
    const s = state[sec.id];
    if (s.checked) {
      totalCorrect += s.score;
      totalQuestions += sec.questions.length;
      totalAnswered += sec.questions.length;
    }
  });
  document.getElementById('totalScore').textContent = totalQuestions > 0 ? `${totalCorrect}/${totalQuestions}` : '0';
  document.getElementById('totalAnswered').textContent = totalAnswered;
  const pct = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) + '%' : '—';
  const el = document.getElementById('totalAccuracy');
  el.textContent = pct;
  el.classList.toggle('perfect', totalQuestions > 0 && totalCorrect === totalQuestions);
}

// ============================================================
// INTERACTIONS
// ============================================================
function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.quiz-section').forEach(s => s.classList.toggle('active', s.dataset.section === id));
  document.querySelectorAll('.nav-tab').forEach((t, i) => t.classList.toggle('active', quizData[i].id === id));
}

function selectOption(secId, qIdx, optIdx) {
  if (state[secId].checked) return;
  state[secId].answers[qIdx] = optIdx;
  renderQuiz();
}

function inputAnswer(secId, qIdx, val) {
  if (state[secId].checked) return;
  state[secId].answers[qIdx] = val;
}

function checkSection(secId) {
  const sec = quizData.find(s => s.id === secId);
  const s = state[secId];
  s.checked = true;
  s.score = 0;
  sec.questions.forEach((q, i) => {
    const userAns = s.answers[i];
    if (sec.type === 'mcq') {
      if (userAns === q.ans) s.score++;
    } else {
      if (q.ans.some(a => a.toLowerCase().trim() === (userAns || '').toLowerCase().trim())) s.score++;
    }
  });
  renderTabs();
  renderQuiz();
  updateScoreboard();
  // Confetti on perfect
  if (s.score === sec.questions.length) launchConfetti();
}

function resetSection(secId) {
  state[secId] = { answers: {}, checked: false, score: 0 };
  renderTabs();
  renderQuiz();
  updateScoreboard();
}

// ============================================================
// HELPERS
// ============================================================
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============================================================
// CONFETTI 🎉
// ============================================================
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = [];
  const colors = ['#C41E3A', '#D4A843', '#2E8B57', '#4A90D9', '#FF69B4', '#FFD700'];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 4 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: Math.random() * 2 - 1,
      rot: Math.random() * 360,
      vr: Math.random() * 6 - 3,
      opacity: 1
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach(p => {
      if (p.opacity <= 0) return;
      alive = true;
      p.y += p.vy;
      p.x += p.vx;
      p.rot += p.vr;
      if (frame > 60) p.opacity -= 0.01;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

// ============================================================
// INIT
// ============================================================
renderTabs();
renderQuiz();
updateScoreboard();
</script>
