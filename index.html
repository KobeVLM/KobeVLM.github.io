<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kobe's Full-Stack + AI Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0D1117;
    --surface:   #161B22;
    --border:    #21262D;
    --blue:      #58A6FF;
    --green:     #3FB950;
    --orange:    #D29922;
    --text:      #F0F6FC;
    --muted:     #8B949E;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 24px;
    max-width: 720px;
    margin: 0 auto;
  }

  .header-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  header p {
    color: var(--muted);
    font-size: 13px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .07em;
  }

  .progress-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--blue);
  }

  .bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width .4s ease;
  }

  /* ── PHASE LAYOUT ── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── PHASE CARD ── */
  .phase {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
    transition: border-color .2s;
  }

  .phase.done { border-color: #238636; }
  .phase.active { border-color: var(--blue); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .phase-header:hover { background: rgba(255,255,255,.02); }

  .phase-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    min-width: 28px;
    letter-spacing: .05em;
  }

  .phase-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .phase-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid;
    white-space: nowrap;
  }

  .badge-done   { color: var(--green);  border-color: #238636;  background: rgba(63,185,80,.08); }
  .badge-active { color: var(--blue);   border-color: var(--blue); background: rgba(88,166,255,.08); }
  .badge-todo   { color: var(--muted);  border-color: var(--border); background: transparent; }

  .phase-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 8px;
  }

  .chevron {
    color: var(--muted);
    font-size: 10px;
    margin-left: 4px;
    transition: transform .2s;
  }

  .phase.open .chevron { transform: rotate(90deg); }

  /* ── TOPICS ── */
  .topics {
    display: none;
    border-top: 1px solid var(--border);
    padding: 12px 16px 16px;
  }

  .phase.open .topics { display: block; }

  .topics-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }

  .topic {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: background .15s;
  }

  .topic:hover { background: rgba(255,255,255,.03); }

  .topic input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: background .15s, border-color .15s;
  }

  .topic input[type="checkbox"]:checked {
    background: var(--green);
    border-color: var(--green);
  }

  .topic input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 1px;
    width: 5px;
    height: 8px;
    border: 2px solid #0D1117;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .topic-label {
    font-size: 13px;
    color: var(--text);
    line-height: 1.3;
  }

  .topic.checked .topic-label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: #3d444d;
  }

  .topic-link {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--blue);
    text-decoration: none;
    opacity: 0;
    transition: opacity .15s;
    white-space: nowrap;
  }

  .topic:hover .topic-link { opacity: 1; }
  .topic-link:hover { text-decoration: underline; }

  /* ── PHASE PROGRESS BAR ── */
  .phase-bar-wrap { margin-top: 4px; }

  .phase-bar-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }

  .phase-bar-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .phase-bar-pct {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .phase-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .phase-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
    transition: width .3s ease;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-note {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .reset-btn {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }

  .reset-btn:hover { color: var(--text); border-color: var(--muted); }

  @media (max-width: 500px) {
    header, .progress-wrap, main, footer { padding-left: 16px; padding-right: 16px; }
    .phase-time { display: none; }
  }
</style>
</head>

const STORAGE_KEY = "kobe-roadmap-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

function getPhaseStatus(phase) {
  const total = phase.topics.length;
  const done = phase.topics.filter(t => state[t.id]).length;
  if (done === 0) return "todo";
  if (done === total) return "done";
  return "active";
}

function renderAll() {
  const container = document.getElementById("roadmap");
  container.innerHTML = "";

  PHASES.forEach(phase => {
    const status = getPhaseStatus(phase);
    const doneCnt = phase.topics.filter(t => state[t.id]).length;
    const total = phase.topics.length;
    const pct = Math.round((doneCnt / total) * 100);

    const el = document.createElement("div");
    el.className = `phase ${status}`;
    el.dataset.id = phase.id;

    const badgeClass = status === "done" ? "badge-done" : status === "active" ? "badge-active" : "badge-todo";
    const badgeLabel = status === "done" ? "Complete" : status === "active" ? "In Progress" : "To Do";

    el.innerHTML = `
      <div class="phase-header" onclick="togglePhase('${phase.id}')">
        <span class="phase-num">${phase.num}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-badge ${badgeClass}">${badgeLabel}</span>
        <span class="phase-time">${phase.time}</span>
        <span class="chevron">›</span>
      </div>
      <div class="topics">
        <div class="topics-grid">
          ${phase.topics.map(t => `
            <label class="topic ${state[t.id] ? 'checked' : ''}" onclick="toggleTopic('${t.id}', event)">
              <input type="checkbox" ${state[t.id] ? 'checked' : ''} />
              <span class="topic-label">${t.label}</span>
              ${t.url ? `<a class="topic-link" href="${t.url}" target="_blank" rel="noopener" onclick="e=>e.stopPropagation()">↗ open</a>` : ''}
            </label>
          `).join('')}
        </div>
        <div class="phase-bar-wrap">
          <div class="phase-bar-meta">
            <span class="phase-bar-label">Phase progress</span>
            <span class="phase-bar-pct">${doneCnt} / ${total} · ${pct}%</span>
          </div>
          <div class="phase-track">
            <div class="phase-fill" style="width:${pct}%"></div>
          </div>
        </div>
      </div>
    `;

    container.appendChild(el);

    // restore open state
    if (state[`_open_${phase.id}`]) el.classList.add("open");
  });

  updateGlobal();
}

function togglePhase(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  const isOpen = el.classList.toggle("open");
  state[`_open_${id}`] = isOpen;
  saveState(state);
}

function toggleTopic(id, e) {
  // prevent label double-firing
  if (e.target.tagName === "A") return;
  state[id] = !state[id];
  saveState(state);
  renderAll();

  // re-open the phase after re-render
  const phaseEl = document.querySelector(`[data-id]`);
}

function updateGlobal() {
  const allTopics = PHASES.flatMap(p => p.topics);
  const total = allTopics.length;
  const done = allTopics.filter(t => state[t.id]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById("global-count").textContent = `${done} / ${total} topics`;
  document.getElementById("global-bar").style.width = pct + "%";
}

function resetAll() {
  if (!confirm("Reset all progress? This can't be undone.")) return;
  const openStates = {};
  PHASES.forEach(p => { if (state[`_open_${p.id}`]) openStates[`_open_${p.id}`] = true; });
  state = { ...openStates };
  saveState(state);
  renderAll();
}

      { name: "Notion",          desc: "Docs and wikis. Common in remote teams." },
      { name: "Slack",           desc: "Standard async communication at tech companies." },
    ]
  },
];

function renderTools() {
  const wrap = document.getElementById("tools-section");
  wrap.innerHTML = TOOL_GROUPS.map(group => `
    <div class="tool-group">
      <div class="tool-group-label">${group.category}</div>
      <div class="tool-list">
        ${group.tools.map(t => `
          <div class="tool-item">
            <span class="tool-name">${t.name}</span>
            <span class="tool-desc">${t.desc}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

renderAll();
renderTools();
</script>
</body>
</html>
